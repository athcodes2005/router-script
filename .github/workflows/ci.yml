name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  shell-and-tests:
    name: Shell & Sandbox Tests
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit: a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install shellcheck and dash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck dash curl

      - name: Check POSIX and dash syntax
        run: |
          for f in *.sh; do
            sh -n "$f"
            dash -n "$f"
          done

      - name: Run ShellCheck
        run: |
          # SC3013 (test -nt/-ot/-ef): BusyBox ash and dash both support these;
          # shellcheck >= 0.11 no longer flags them, but Ubuntu's older package does.
          shellcheck -s sh -S warning -e SC1087,SC1090,SC1091,SC3013 *.sh

      - name: Run Python test suite
        run: |
          python3 -m unittest discover -s tests -v

  # The router's updater installs whatever the deploy branch points at and
  # cannot ask GitHub for a commit's CI result (see update_from_git.sh). The
  # branch therefore moves only here, to a commit of main whose checks passed.
  promote:
    name: Advance deploy
    needs: shell-and-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: promote-deploy
    steps:
      - name: Fast-forward deploy to this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api --silent -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/deploy" \
              -f sha="$GITHUB_SHA" -F force=false; then
            echo "deploy now points at $GITHUB_SHA."
            exit 0
          fi
          # A later commit's run can finish first; deploy is then past this one.
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...deploy" --jq .status)"
          case "$status" in
            ahead|identical)
              echo "deploy already contains $GITHUB_SHA." ;;
            *)
              echo "::error::deploy could not be fast-forwarded to $GITHUB_SHA (deploy is $status)."
              exit 1 ;;
          esac
